name: release
# Builds and checks the launcher's release files; a real run on main or a release/launcher-* patch line (LAUNCHER_RELEASES=on) leaves them as an unsigned draft vX.Y.Z with build provenance, which sunrise-org/sunrise's launcher-bridge.yml signs and publishes.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and check everything, but leave no tag or draft
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  # Test runs never reach the telemetry server: no live-count ping, no uploads.
  SUNRISE_TELEMETRY_URL: "off"
  LAUNCHER_PREFIX: sunrise-launcher
  LAUNCHER_INSTALL_FOLDER: Sunrise Launcher
  LAUNCHER_APP_BUNDLE: Sunrise Launcher.app

jobs:
  decide:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      assets: ${{ steps.matrix.outputs.assets }}
      tag: ${{ steps.decide.outputs.tag }}
      version: ${{ steps.decide.outputs.version }}
      dry_run: ${{ steps.mode.outputs.dry_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: matrix
        run: |
          echo "matrix=$(python3 tools/launcher_build_matrix.py)" >> "$GITHUB_OUTPUT"
          echo "assets=$(python3 tools/launcher_build_matrix.py --assets)" >> "$GITHUB_OUTPUT"
      - id: mode
        env:
          ASKED: ${{ inputs.dry_run }}
        # Off main and the patch lines cut from a release tag, every run is a dry run.
        run: |
          dry=true
          [[ ("$GITHUB_REF" == refs/heads/main || "$GITHUB_REF" == refs/heads/release/launcher-*) && "$ASKED" == false ]] && dry=false
          echo "dry_run=$dry" >> "$GITHUB_OUTPUT"
      - name: Releases are on, or this is a dry run
        env:
          DRY_RUN: ${{ steps.mode.outputs.dry_run }}
          RELEASES: ${{ vars.LAUNCHER_RELEASES }}
        run: |
          if [[ "$DRY_RUN" != true && "$RELEASES" != on ]]; then
            echo "::error::Launcher releases are off until the owners set LAUNCHER_RELEASES=on."
            exit 1
          fi
      - id: decide
        env:
          DRY_RUN: ${{ steps.mode.outputs.dry_run }}
        run: |
          set -euo pipefail
          if ! python3 tools/release_notes.py decide --head "$GITHUB_SHA" > decision.json; then
            # A dry run still builds when Cargo.toml's version can't be released; a release never does.
            [[ "$DRY_RUN" == true ]] || exit 1
            echo "{\"version\": \"0.0.0\", \"tag\": \"v0.0.0\", \"head\": \"$GITHUB_SHA\"}" > decision.json
          fi
          for key in tag version; do echo "$key=$(jq -r ".$key" decision.json)" >> "$GITHUB_OUTPUT"; done
          echo "### $(jq -r .tag decision.json) at ${GITHUB_SHA:0:9} (dry run: $DRY_RUN)" >> "$GITHUB_STEP_SUMMARY"
      - name: Notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.decide.outputs.tag }}
        run: |
          python3 tools/release_notes.py notes --tag "$TAG" --head "$GITHUB_SHA" --base "$GITHUB_REF_NAME" --out notes > /dev/null
          { echo "## $(cat notes/title.txt)"; echo; cat notes/body.md; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notes
          path: notes/*
          if-no-files-found: error
          retention-days: 3

  build:
    needs: decide
    name: build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.decide.outputs.matrix) }}
    # BLACKSMITH_RELEASE=on (a repository variable; unset or anything else is off) builds Linux and Windows on their
    # Blacksmith machines (`blacksmith` in tools/launcher_build_matrix.py: the same images as GitHub's, Linux on the same
    # Ubuntu 22.04 and so the same glibc). macOS stays on GitHub's runner: an_app_bundle_updates_in_place fails on
    # Blacksmith's macOS 15 (run 45745995661). The jobs that attest, draft and publish stay on GitHub's runners.
    runs-on: ${{ vars.BLACKSMITH_RELEASE == 'on' && matrix.blacksmith || (matrix.mac && 'macos-latest' || matrix.os) }}
    timeout-minutes: 40
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
      BIN: ${{ matrix.target && format('target/{0}/release', matrix.target) || 'target/release' }}
      # Sunrise's Azure app for Microsoft sign-in: a repository variable, not a secret; unset, sign-in says it isn't configured.
      SUNRISE_MSA_CLIENT_ID: ${{ vars.SUNRISE_MSA_CLIENT_ID }}
      # The release's version and tag, built in (backend::VERSION and own_tag): no version-bump commits.
      SUNRISE_LAUNCHER_VERSION: ${{ needs.decide.outputs.version }}
      SUNRISE_LAUNCHER_TAG: ${{ needs.decide.outputs.tag }}
      # Ad hoc signed until a separate gated job provisions Apple signing and notarization: packaging/macos never sees an identity.
      MACOS_SIGN_IDENTITY: ""
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The pinned Rust (tools/ci/rust-version)
        id: rust
        run: echo "version=$(cat tools/ci/rust-version)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master, 2026-11-15
        with:
          toolchain: ${{ steps.rust.outputs.version }}
          targets: ${{ matrix.target }}
      - name: Linux libraries GPUI links to
        if: runner.os == 'Linux'
        run: >-
          bash tools/ci/install_launcher_deps.sh libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev
          libfontconfig-dev libvulkan-dev libasound2-dev libudev-dev patchelf
      - name: Metal shaders compiled now, or at run time without the Metal toolchain
        if: runner.os == 'macOS'
        run: |
          if ! xcrun metal --version > /dev/null 2>&1; then
            echo "::notice::No Metal toolchain on this runner: GPUI compiles its shaders at run time"
            echo "LAUNCHER_FEATURES=gpui_platform/runtime_shaders" >> "$GITHUB_ENV"
          fi
      - name: Keep the tests away from this runner's own folders
        run: |
          for name in SUNRISE_HOME SUNRISE_LAUNCHER_HOME XDG_DATA_HOME XDG_CONFIG_HOME SUNRISE_LAUNCHER_TRASH SUNRISE_LAUNCHER_CLIPBOARD SUNRISE_LAUNCHER_DESKTOP; do
            path="${RUNNER_TEMP//\\//}/launcher-isolation/$name"
            mkdir -p "$path"
            echo "$name=$path" >> "$GITHUB_ENV"
          done
          echo "SUNRISE_LAUNCHER_NO_SELF_UPDATE=1" >> "$GITHUB_ENV"
          echo "SUNRISE_NO_AUDIO=1" >> "$GITHUB_ENV"
          # Lease fixtures refuse symlinked paths, and macOS's default TMPDIR goes through /var.
          if [[ "$RUNNER_OS" == macOS ]]; then
            echo "TMPDIR=$(cd "$RUNNER_TEMP" && pwd -P)/" >> "$GITHUB_ENV"
          fi
      - run: cargo test --release --locked ${{ matrix.target && format('--target {0}', matrix.target) || '' }} ${LAUNCHER_FEATURES:+--features "$LAUNCHER_FEATURES"}
      - run: cargo build --release --locked ${{ matrix.target && format('--target {0}', matrix.target) || '' }} ${LAUNCHER_FEATURES:+--features "$LAUNCHER_FEATURES"}
      - name: Release binary retains the game-holder capability marker
        run: |
          python=python3; [[ "$RUNNER_OS" != Windows ]] || python=python
          "$python" -c 'import pathlib, sys; assert b"sunrise-private-holder-v2;" in pathlib.Path(sys.argv[1]).read_bytes(), "capability marker missing from this binary (release optimisation?)"' "$BIN/${{ matrix.binary }}"
      - name: Windows executable architecture
        if: runner.os == 'Windows'
        run: python tools/check_pe_arch.py "${{ matrix.pe_arch }}" "$BIN/${{ matrix.binary }}"
      - name: Unrelated DLLs cannot intercept launcher or setup startup
        if: runner.os == 'Windows'
        run: python tools/test_launcher_dll_search.py "$BIN/${{ matrix.binary }}"
      - name: The version is the release's
        run: |
          out=$("$BIN/${{ matrix.binary }}" --version)
          echo "$out"
          [[ "$out" == "$LAUNCHER_PREFIX $SUNRISE_LAUNCHER_VERSION" ]] || { echo "::error::expected $LAUNCHER_PREFIX $SUNRISE_LAUNCHER_VERSION"; exit 1; }
      - name: Only system libraries
        run: |
          file="$BIN/${{ matrix.binary }}"
          case "$RUNNER_OS" in
            Windows) python tools/check_imports.py "$file" ;;
            macOS) others=$(otool -L "$file" | tail -n +2 | awk '{print $1}' | grep -v -E '^(/usr/lib/|/System/Library/)' || true)
                   [[ -z "$others" ]] || { echo "::error::links $others"; exit 1; } ;;
          esac
      - name: Smoke test
        env:
          SUNRISE_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export SUNRISE_LAUNCHER_HOME="${RUNNER_TEMP//\\//}/sunrise-launcher-smoke"
          export SUNRISE_HOME="$SUNRISE_LAUNCHER_HOME/game"
          rm -rf "$SUNRISE_LAUNCHER_HOME"
          launcher="$PWD/$BIN/${{ matrix.binary }}"
          # GitHub's API rate-limits shared runner addresses now and then: try a few times.
          retry() { for i in 1 2 3 4; do "$@" && return 0; sleep $((i * 15)); done; return 1; }
          retry "$launcher" versions
          "$launcher" links --json
          # The per-user Windows setup: the same binary under the setup's name installs into a scratch folder, and its copy uninstalls itself.
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            setup="$RUNNER_TEMP/setup-smoke"
            cp "$launcher" "$RUNNER_TEMP/$LAUNCHER_PREFIX-setup.exe"
            "$RUNNER_TEMP/$LAUNCHER_PREFIX-setup.exe" setup --quiet --dir "$setup"
            installed="$setup/$LAUNCHER_INSTALL_FOLDER/$LAUNCHER_PREFIX.exe"
            [[ -f "$installed" ]] || { echo "::error::the setup copied no launcher"; exit 1; }
            "$installed" uninstall --quiet
            [[ ! -f "$installed" ]] || { echo "::error::uninstall left the launcher"; exit 1; }
            rm -rf "$setup"
          fi
          rm -rf "$SUNRISE_LAUNCHER_HOME"
      - name: Package
        run: |
          rm -rf dist out && mkdir -p out
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            # The app, zipped (self-update) and in a .dmg (installer), signed ad hoc: packaging/macos.
            python3 -m venv "$RUNNER_TEMP/dmg" && "$RUNNER_TEMP/dmg/bin/pip" install --quiet dmgbuild==1.6.5
            DMGBUILD="$RUNNER_TEMP/dmg/bin/dmgbuild" packaging/macos/package.sh "$BIN/${{ matrix.binary }}" "$SUNRISE_LAUNCHER_VERSION" out ${{ matrix.mac_arch }}
            rm -rf "out/$LAUNCHER_APP_BUNDLE"
          else
            if [[ "$RUNNER_OS" == "Linux" ]]; then
              # The .tar.gz is what the launcher updates itself from; the AppImage replaces itself instead.
              packaging/linux/appimage.sh "$BIN/${{ matrix.binary }}" "$SUNRISE_LAUNCHER_VERSION" out
            fi
            mkdir -p dist
            cp "$BIN/${{ matrix.binary }}" LICENSE dist/
            packaging/copy-notices.sh . dist/LICENSES
            if [[ "${{ matrix.asset }}" == *.tar.gz ]]; then
              (cd dist && tar czf ../out/${{ matrix.asset }} ${{ matrix.binary }} LICENSE LICENSES)
            else
              (cd dist && 7z a ../out/${{ matrix.asset }} ${{ matrix.binary }} LICENSE LICENSES)
            fi
          fi
          ls -l out
      - name: Setup exe (Windows)
        # The launcher's binary under the setup's name: started with no arguments it shows the per-user installer.
        if: runner.os == 'Windows'
        run: cp "$BIN/${{ matrix.binary }}" "out/${{ matrix.setup_asset }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.asset }}
          path: out/*
          if-no-files-found: error
          retention-days: 3

  # Exactly the files the matrix makes, each as its build uploaded it, and a throwaway signature checked as launchers check one.
  check:
    needs: [decide, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The pinned Rust (tools/ci/rust-version)
        id: rust
        run: echo "version=$(cat tools/ci/rust-version)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master, 2026-11-15
        with:
          toolchain: ${{ steps.rust.outputs.version }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: ${{ env.LAUNCHER_PREFIX }}-*
          merge-multiple: true
          digest-mismatch: error
      - name: Every expected file, and nothing else
        env:
          EXPECTED: ${{ needs.decide.outputs.assets }}
        run: |
          python3 -I - <<'PY'
          import json, os
          expected = json.loads(os.environ["EXPECTED"])
          found = sorted(os.listdir("dist"))
          if found != expected:
              raise SystemExit(f"the builds made {found}, not {expected}")
          PY
      - name: The checksums, and a throwaway signature checked as launchers check one
        env:
          TAG: ${{ needs.decide.outputs.tag }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum -- "$LAUNCHER_PREFIX"-*) > "$RUNNER_TEMP/SHA256SUMS"
          cp -r dist "$RUNNER_TEMP/dry"
          bash tools/ci/sign_release.sh "$TAG" "$RUNNER_TEMP/dry/$LAUNCHER_PREFIX"-*
          cmp "$RUNNER_TEMP/SHA256SUMS" "$RUNNER_TEMP/dry/SHA256SUMS"
          key=$(cat "$RUNNER_TEMP/dry/ephemeral.pub") && rm "$RUNNER_TEMP/dry/ephemeral.pub"
          cargo run --locked --quiet -p sunrise-launcher-release-verify --bin verify-launcher-release -- --tag "$TAG" --key "$key" "$RUNNER_TEMP/dry"
          mv "$RUNNER_TEMP/SHA256SUMS" dist/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: dist/*
          if-no-files-found: error
          retention-days: 3

  # A real release on main or a patch line only: the tag at the built commit, never an existing one, and an unsigned draft with build provenance for the game repository to sign.
  publish:
    needs: [decide, check]
    if: needs.decide.outputs.dry_run == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist
          digest-mismatch: error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notes
          path: notes
          digest-mismatch: error
      - name: The files are SHA256SUMS's, all of them and no others
        run: |
          set -euo pipefail
          cd dist
          sha256sum --check --strict --quiet SHA256SUMS
          diff <(awk '{print $2}' SHA256SUMS | sort) <(ls | grep -vx SHA256SUMS | sort)
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/${{ env.LAUNCHER_PREFIX }}-*
      - name: The release record (tag, version and commit) for the game repository's bridge
        env:
          TAG: ${{ needs.decide.outputs.tag }}
          VERSION: ${{ needs.decide.outputs.version }}
        run: |
          jq -n --arg tag "$TAG" --arg version "$VERSION" --arg commit "$GITHUB_SHA" '{tag: $tag, version: $version, commit: $commit}' > "$RUNNER_TEMP/release-record.json"
      # One attestation binds the whole release: every file name and SHA-256 in SHA256SUMS, for this tag at this commit; the bridge signs nothing else.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
          predicate-type: https://playsunrise.net/attestation/launcher-release/v1
          predicate-path: ${{ runner.temp }}/release-record.json
      # The tag comes only now, after every build and check passed: a failed build never uses up a version.
      - name: Tag ${{ needs.decide.outputs.tag }} at the built commit, never another commit's tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.decide.outputs.tag }}
        run: |
          if ! gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" > /dev/null; then
            # Re-running this run's failed jobs finds its own tag: the same commit goes on, any other is refused.
            [[ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq .object.sha)" == "$GITHUB_SHA" ]] ||
              { echo "::error::$TAG exists at another commit: release the next version"; exit 1; }
          fi
      - name: The unsigned draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.decide.outputs.tag }}
          VERSION: ${{ needs.decide.outputs.version }}
        run: |
          set -euo pipefail
          # A draft for this tag is an earlier attempt's, unsigned and unseen: it is replaced; a published release never is.
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.tag_name == \"$TAG\") | \"\(.id) \(.draft)\"" | while read -r id draft; do
            [[ "$draft" == true ]] || { echo "::error::$TAG is already published"; exit 1; }
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
          done
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" --verify-tag --draft --title "$(cat notes/title.txt)" \
            --notes-file notes/body.md dist/*
          echo "Draft $TAG is up. Sign and publish it from the game repository: gh workflow run launcher-bridge.yml -R sunrise-org/sunrise --ref main -f version=$VERSION -f source_ref=$GITHUB_REF" >> "$GITHUB_STEP_SUMMARY"
