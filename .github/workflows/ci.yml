name: CI
# A dispatch with `pr` runs on main but tests that pull request's head, so it is named for it.
run-name: "${{ inputs.pr && format('PR #{0} checks', inputs.pr) || github.event.pull_request.title || github.event.head_commit.message || github.workflow }}"
# Static checks on every pull request; the full checks on this repository's own branches, main and dispatches, and on a fork's head only by `gh workflow run ci.yml --ref main -f pr=<n>`, which posts `build` there.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr:
        description: A fork's pull request whose head gets the full checks, on GitHub's runners, and `build` posted on it
        type: string
        default: ''
      force_hosted:
        description: Run on GitHub's runners even while Dyna's pool is leased
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || inputs.pr && format('pr-{0}', inputs.pr) || github.sha }}
  cancel-in-progress: true

env:
  # Test runs never reach the telemetry server: no live-count ping, no uploads.
  SUNRISE_TELEMETRY_URL: "off"
  CARGO_TERM_COLOR: always

jobs:
  # Decides on GitHub's runner, running none of the repository's code: whether the full checks run, on which commit, and whether that code may use Dyna's pool.
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.rust.outputs.version }}
      full: ${{ steps.route.outputs.full }}
      sha: ${{ steps.route.outputs.sha }}
      trusted: ${{ steps.route.outputs.trusted }}
      runner: ${{ steps.route.outputs.runner }}
    steps:
      # Rust is pinned by the workflow's own revision (main's on a dispatch), never by the head a dispatch tests.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: pin
          sparse-checkout: tools/ci/rust-version
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - id: rust
        run: |
          version=$(tr -d '[:space:]' < pin/tools/ci/rust-version)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::tools/ci/rust-version holds $version, not X.Y.Z"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - id: route
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR: ${{ inputs.pr }}
          FORCE_HOSTED: ${{ github.event_name == 'workflow_dispatch' && inputs.force_hosted }}
          LEASE: ${{ vars.DYNA_CI_POOL_UNTIL }}
          POOL: ${{ vars.SUNRISE_LAUNCHER_CI_RUNNER }}
        run: |
          full=true sha= trusted=true
          if [[ "$EVENT" == pull_request && "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]]; then
            full=false trusted=false
          elif [[ "$EVENT" == workflow_dispatch && -n "$PR" ]]; then
            [[ "$PR" =~ ^[1-9][0-9]{0,6}$ ]] || { echo "::error::pr must be a pull request number, not $PR"; exit 1; }
            read -r state sha repo < <(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq '"\(.state) \(.head.sha) \(.head.repo.full_name // "")"')
            [[ "$state" == open ]] || { echo "::error::pull request #$PR is $state"; exit 1; }
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::pull request #$PR has no head commit"; exit 1; }
            [[ "$repo" != "$GITHUB_REPOSITORY" ]] || { echo "::error::#$PR is this repository's own: its own run checks its head, so re-run that"; exit 1; }
            trusted=false
          fi
          # Dyna's pool only for this repository's own code, while SUNRISE_LAUNCHER_CI_RUNNER names it and its lease (DYNA_CI_POOL_UNTIL, Unix seconds) holds.
          runner=ubuntu-24.04
          if [[ "$trusted" == true && "$FORCE_HOSTED" != true && -n "$POOL" && "$LEASE" =~ ^[0-9]{1,12}$ ]] &&
             [ "$LEASE" -gt "$(date +%s)" ]; then
            runner=$POOL
          fi
          # Hosted is the agreed fallback, but a trusted run says why it left the pool.
          if [[ "$trusted" == true && "$runner" != "$POOL" && "$FORCE_HOSTED" != true ]]; then
            if [[ -z "$POOL" ]]; then why="vars.SUNRISE_LAUNCHER_CI_RUNNER is unset"
            elif [[ ! "$LEASE" =~ ^[0-9]{1,12}$ ]]; then why="vars.DYNA_CI_POOL_UNTIL is unset or not Unix seconds"
            else why="Dyna's lease ran out at $(date -u -d "@$LEASE" +%FT%TZ)"; fi
            echo "::warning title=Linux on GitHub's runner::$why, so Linux runs on ubuntu-24.04"
          fi
          echo "full=$full sha=${sha:-the event commit} trusted=$trusted runner=$runner"
          { echo "full=$full"; echo "sha=$sha"; echo "trusted=$trusted"; echo "runner=$runner"; } >> "$GITHUB_OUTPUT"

  # The cheap checks every pull request gets, a fork's included: no build, GitHub's runner.
  format:
    needs: route
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.route.outputs.sha }}
          persist-credentials: false
      - name: Compare game copies to the Sunrise pin
        run: |
          game=$(mktemp -d "$RUNNER_TEMP/sunrise-game.XXXXXX")
          tools/ci/game_at.sh "$(cat tools/ci/sunrise-commit)" "$game"
          SUNRISE_GAME_DIR="$game" python3 -m unittest tools/tests/test_game_copies.py
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master, 2026-11-15
        with:
          toolchain: ${{ needs.route.outputs.rust }}
          components: rustfmt
      - run: cargo fmt --all --check

  check:
    name: check (${{ matrix.name }})
    needs: route
    if: needs.route.outputs.full == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux, os: ubuntu-24.04 }
          - { name: macos, os: macos-latest }
          # The launcher builds native mods for windows-gnu: registry_compile's tests emit metadata for it.
          - { name: windows, os: windows-latest, targets: x86_64-pc-windows-gnu }
    runs-on: ${{ matrix.name == 'linux' && needs.route.outputs.runner || matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A dispatch with `pr`: that pull request's head; otherwise this event's commit.
          ref: ${{ needs.route.outputs.sha }}
          persist-credentials: false
      # Dyna's runners carry these headers and Rust's caches already.
      - name: Linux headers GPUI links against
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        run: >-
          bash tools/ci/install_launcher_deps.sh libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev
          libfontconfig-dev libvulkan-dev libasound2-dev libudev-dev
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master, 2026-11-15
        with:
          toolchain: ${{ needs.route.outputs.rust }}
          components: rustfmt, clippy
          targets: ${{ matrix.targets }}
      # A fork's code, dispatched on main, never touches main's caches: no restore, no save.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: runner.environment == 'github-hosted' && needs.route.outputs.trusted == 'true'
        with:
          shared-key: ci-${{ matrix.name }}
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Keep the tests away from this runner's own folders
        run: |
          for name in SUNRISE_HOME SUNRISE_LAUNCHER_HOME XDG_DATA_HOME XDG_CONFIG_HOME SUNRISE_LAUNCHER_TRASH SUNRISE_LAUNCHER_CLIPBOARD SUNRISE_LAUNCHER_DESKTOP; do
            path="${RUNNER_TEMP//\\//}/launcher-isolation/$name"
            mkdir -p "$path"
            echo "$name=$path" >> "$GITHUB_ENV"
          done
          echo "SUNRISE_LAUNCHER_NO_SELF_UPDATE=1" >> "$GITHUB_ENV"
          echo "SUNRISE_NO_AUDIO=1" >> "$GITHUB_ENV"
          # Lease fixtures refuse symlinked paths, and macOS's default TMPDIR goes through /var.
          if [[ "$RUNNER_OS" == macOS ]]; then
            echo "TMPDIR=$(cd "$RUNNER_TEMP" && pwd -P)/" >> "$GITHUB_ENV"
          fi
      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: The holder test's actor (Windows)
        if: runner.os == 'Windows'
        run: cargo build --locked -p sunrise-launcher-smod --example holder_actor
      - name: Tests
        run: cargo test --locked --workspace --lib --bins
      - name: Real launcher Play and game relay fixtures
        run: cargo test --locked --test ordinary_play --test managed_play_process
      - name: The tests/ targets that start no process (Windows)
        if: runner.os == 'Windows'
        run: cargo test --locked --test developer_install --test storage_consent
      - name: Doc tests
        if: runner.os == 'Linux'
        run: cargo test --locked --workspace --doc
      - name: The release signing script and the release check agree
        if: runner.os != 'Windows'
        run: cargo test --locked --workspace --test sign_release
      - name: Release tools
        if: runner.os == 'Linux'
        # test_game_copies needs the pinned Sunrise checkout and runs in `format`, which fetches it.
        run: python3 -m unittest tools/tests/test_release_notes.py tools/tests/test_game_copies_issue.py tools/tests/test_rerun_unacquired.py

  # The one check branch protection requires, on the commit it tested: a fork's pull request names it otherwise until a maintainer's dispatch posts `build`, and a dispatch's own run (on main) never names it.
  build:
    name: >-
      ${{ inputs.pr && format('checks of PR #{0}', inputs.pr) ||
      github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository &&
      'format (full checks wait for a maintainer)' || 'build' }}
    needs: [route, format, check]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Every system passed
        env:
          FULL: ${{ needs.route.outputs.full }}
          ROUTE: ${{ needs.route.result }}
          FORMAT: ${{ needs.format.result }}
          CHECK: ${{ needs.check.result }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          [[ "$ROUTE" == success ]] || { echo "::error::routing $ROUTE"; exit 1; }
          [[ "$FORMAT" == success ]] || { echo "::error::format $FORMAT"; exit 1; }
          if [[ "$FULL" == true ]]; then
            [[ "$CHECK" == success ]] || { echo "::error::systems $CHECK"; exit 1; }
          elif [[ "$FULL" == false ]]; then
            echo "::notice::A fork's pull request: a maintainer runs the full checks with gh workflow run ci.yml -R $GITHUB_REPOSITORY --ref main -f pr=$PR"
          else
            echo "::error::routing gave no answer"; exit 1
          fi

  # A dispatch for a fork's pull request: posts `build` on its head. It runs none of that code, so it alone holds the write permission, and only for commit statuses.
  pr-status:
    needs: [route, format, check]
    if: always() && github.event_name == 'workflow_dispatch' && inputs.pr != '' && needs.route.outputs.sha != '' && needs.route.outputs.trusted == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.route.outputs.sha }}
          FORMAT: ${{ needs.format.result }}
          CHECK: ${{ needs.check.result }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          state=failure
          if [[ "$FORMAT" == success && "$CHECK" == success ]]; then state=success
          elif [[ "$FORMAT" == cancelled || "$CHECK" == cancelled ]]; then state=error; fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state="$state" -f context=build \
            -f description="Full checks dispatched on this head: format $FORMAT, systems $CHECK" -f target_url="$RUN" > /dev/null
          echo "build=$state on $SHA"
