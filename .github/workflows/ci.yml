name: CI
# A dispatch with `pr` runs on main but tests that pull request's head, so it is named for it.
run-name: "${{ inputs.pr && format('PR #{0} checks', inputs.pr) || github.event.pull_request.title || github.event.head_commit.message || github.workflow }}"
# Static checks on every pull request; the full checks on this repository's own branches, main and dispatches, and on a fork's head only by `gh workflow run ci.yml --ref main -f pr=<n>`, which posts `build` there.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr:
        description: A fork's pull request whose head gets the full checks, on GitHub's runners, and `build` posted on it
        type: string
        default: ''
      force_hosted:
        description: Run on GitHub's runners even while Dyna's pool is leased
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || inputs.pr && format('pr-{0}', inputs.pr) || github.sha }}
  cancel-in-progress: true

env:
  # Test runs never reach the telemetry server: no live-count ping, no uploads.
  SUNRISE_TELEMETRY_URL: "off"
  CARGO_TERM_COLOR: always

jobs:
  # Decides on GitHub's runner, running none of the repository's code: whether the full checks run, on which commit, and whether that code may use Dyna's pool.
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.rust.outputs.version }}
      full: ${{ steps.route.outputs.full }}
      sha: ${{ steps.route.outputs.sha }}
      trusted: ${{ steps.route.outputs.trusted }}
      runner: ${{ steps.route.outputs.runner }}
    steps:
      # Rust is pinned by the workflow's own revision (main's on a dispatch), never by the head a dispatch tests.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: pin
          sparse-checkout: tools/ci/rust-version
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - id: rust
        run: |
          version=$(tr -d '[:space:]' < pin/tools/ci/rust-version)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::tools/ci/rust-version holds $version, not X.Y.Z"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - id: route
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR: ${{ inputs.pr }}
          FORCE_HOSTED: ${{ github.event_name == 'workflow_dispatch' && inputs.force_hosted }}
          LEASE: ${{ vars.DYNA_CI_POOL_UNTIL }}
          POOL: ${{ vars.SUNRISE_LAUNCHER_CI_RUNNER }}
        run: |
          full=true sha= trusted=true
          if [[ "$EVENT" == pull_request && "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]]; then
            full=false trusted=false
          elif [[ "$EVENT" == workflow_dispatch && -n "$PR" ]]; then
            [[ "$PR" =~ ^[1-9][0-9]{0,6}$ ]] || { echo "::error::pr must be a pull request number, not $PR"; exit 1; }
            read -r state sha repo < <(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq '"\(.state) \(.head.sha) \(.head.repo.full_name // "")"')
            [[ "$state" == open ]] || { echo "::error::pull request #$PR is $state"; exit 1; }
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::pull request #$PR has no head commit"; exit 1; }
            [[ "$repo" != "$GITHUB_REPOSITORY" ]] || { echo "::error::#$PR is this repository's own: its own run checks its head, so re-run that"; exit 1; }
            trusted=false
          fi
          # Dyna's pool only for this repository's own code, while SUNRISE_LAUNCHER_CI_RUNNER names it and its lease (DYNA_CI_POOL_UNTIL, Unix seconds) holds.
          runner=ubuntu-24.04
          if [[ "$trusted" == true && "$FORCE_HOSTED" != true && -n "$POOL" && "$LEASE" =~ ^[0-9]{1,12}$ ]] &&
             [ "$LEASE" -gt "$(date +%s)" ]; then
            runner=$POOL
          fi
          # Hosted is the agreed fallback, but a trusted run says why it left the pool.
          if [[ "$trusted" == true && "$runner" != "$POOL" && "$FORCE_HOSTED" != true ]]; then
            if [[ -z "$POOL" ]]; then why="vars.SUNRISE_LAUNCHER_CI_RUNNER is unset"
            elif [[ ! "$LEASE" =~ ^[0-9]{1,12}$ ]]; then why="vars.DYNA_CI_POOL_UNTIL is unset or not Unix seconds"
            else why="Dyna's lease ran out at $(date -u -d "@$LEASE" +%FT%TZ)"; fi
            echo "::warning title=Linux on GitHub's runner::$why, so Linux runs on ubuntu-24.04"
          fi
          echo "full=$full sha=${sha:-the event commit} trusted=$trusted runner=$runner"
          { echo "full=$full"; echo "sha=$sha"; echo "trusted=$trusted"; echo "runner=$runner"; } >> "$GITHUB_OUTPUT"

  # The cheap checks every pull request gets, a fork's included: no build, GitHub's runner.
  format:
    needs: route
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.route.outputs.sha }}
          persist-credentials: false
      - name: Compare game copies to the Sunrise pin
        run: |
          game=$(mktemp -d "$RUNNER_TEMP/sunrise-game.XXXXXX")
          tools/ci/game_at.sh "$(cat tools/ci/sunrise-commit)" "$game"
          SUNRISE_GAME_DIR="$game" python3 -m unittest tools/tests/test_game_copies.py
      # The base's own checker, once it has one, so a pull request can't loosen the check it is held to.
      - name: No refactor count rises (docs/refactoring.md §8)
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 -m unittest tools/tests/test_structure_check.py
          git fetch --no-tags --depth=1 origin "$BASE"
          checker="$RUNNER_TEMP/structure_check.py"
          git show "$BASE:tools/ci/structure_check.py" > "$checker" 2>/dev/null || cp tools/ci/structure_check.py "$checker"
          python3 "$checker" --base "$BASE" --head HEAD
      # A new label whose key was never seeded shows English in every language, silently.
      # The base's own checker is used, once it has one, so a pull request cannot loosen the
      # check it is held to (as the structure check above does).
      - name: Every new tr key is in the translation catalog
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 -m unittest tools/tests/test_lang_keys_check.py
          git fetch --no-tags --depth=1 origin "$BASE"
          checker="$RUNNER_TEMP/lang_keys_check.py"
          git show "$BASE:tools/ci/lang_keys_check.py" > "$checker" 2>/dev/null || cp tools/ci/lang_keys_check.py "$checker"
          python3 "$checker" --base "$BASE" --head HEAD
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master, 2026-11-15
        with:
          toolchain: ${{ needs.route.outputs.rust }}
          components: rustfmt
      - run: cargo fmt --all --check

  check:
    name: check (${{ matrix.name }})
    needs: route
    if: needs.route.outputs.full == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux, os: ubuntu-24.04 }
          - { name: macos, os: macos-latest }
          # The launcher builds native mods for windows-gnu: registry_compile's tests emit metadata for it.
          - { name: windows, os: windows-latest, targets: x86_64-pc-windows-gnu }
    runs-on: ${{ matrix.name == 'linux' && needs.route.outputs.runner || matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A dispatch with `pr`: that pull request's head; otherwise this event's commit.
          ref: ${{ needs.route.outputs.sha }}
          persist-credentials: false
      # Dyna's runners carry these headers and Rust's caches already.
      - name: Linux headers GPUI links against
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        run: >-
          bash tools/ci/install_launcher_deps.sh libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev
          libfontconfig-dev libvulkan-dev libasound2-dev libudev-dev
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master, 2026-11-15
        with:
          toolchain: ${{ needs.route.outputs.rust }}
          components: rustfmt, clippy
          targets: ${{ matrix.targets }}
      # A fork's code, dispatched on main, never touches main's caches: no restore, no save.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: runner.environment == 'github-hosted' && needs.route.outputs.trusted == 'true'
        with:
          shared-key: ci-${{ matrix.name }}
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Keep the tests away from this runner's own folders
        run: |
          for name in SUNRISE_HOME SUNRISE_LAUNCHER_HOME XDG_DATA_HOME XDG_CONFIG_HOME SUNRISE_LAUNCHER_TRASH SUNRISE_LAUNCHER_CLIPBOARD SUNRISE_LAUNCHER_DESKTOP; do
            path="${RUNNER_TEMP//\\//}/launcher-isolation/$name"
            mkdir -p "$path"
            echo "$name=$path" >> "$GITHUB_ENV"
          done
          echo "SUNRISE_LAUNCHER_NO_SELF_UPDATE=1" >> "$GITHUB_ENV"
          echo "SUNRISE_NO_AUDIO=1" >> "$GITHUB_ENV"
          # Lease fixtures refuse symlinked paths, and macOS's default TMPDIR goes through /var.
          if [[ "$RUNNER_OS" == macOS ]]; then
            echo "TMPDIR=$(cd "$RUNNER_TEMP" && pwd -P)/" >> "$GITHUB_ENV"
          fi
      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: The holder test's actor (Windows)
        if: runner.os == 'Windows'
        run: cargo build --locked -p sunrise-launcher-smod --example holder_actor
      - name: Tests
        run: cargo test --locked --workspace --lib --bins
      - name: Attestation verifier tests
        run: cargo test --locked -p sunrise-attestation --test verify
      - name: Real launcher Play, game relay, lifecycle and modpack fence fixtures
        run: cargo test --locked --test ordinary_play --test managed_play_process --test lifecycle --test modpack_fence
      - name: The tests/ targets that start no process (Windows)
        if: runner.os == 'Windows'
        run: cargo test --locked --test developer_install
      - name: Doc tests
        if: runner.os == 'Linux'
        run: cargo test --locked --workspace --doc
      - name: The release signing script and the release check agree
        if: runner.os != 'Windows'
        run: cargo test --locked --workspace --test sign_release
      - name: Release tools
        if: runner.os == 'Linux'
        # test_game_copies needs the pinned Sunrise checkout and runs in `format`, which fetches it.
        run: python3 -m unittest tools/tests/test_release_notes.py tools/tests/test_game_copies_issue.py tools/tests/test_rerun_unacquired.py tools/tests/test_launcher_add_lang_keys.py

  # A real native mod build on Windows in the launcher's default home (%APPDATA%\sunrise\launcher), under a user name of 11
  # letters: the depth a player's build reaches, which Windows' 260-character path limit cuts short.
  windows-native-build:
    name: windows-native-build (${{ matrix.build }})
    needs: route
    if: needs.route.outputs.full == 'true'
    runs-on: windows-latest
    timeout-minutes: 90
    # The Nightly moves on its own: a later one that changes the mod's mixin target fails this leg
    # without failing `build`, which the pinned Dev build answers for.
    continue-on-error: ${{ matrix.channel == 'nightly' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Nightly players run, whichever it is today (#396 failed on its SDK), and a Dev build.
          - build: nightly
            channel: nightly
          - build: dev-2026-11-25-bdad86d
            channel: dev
    defaults:
      run:
        shell: bash
    env:
      SUNRISE_LAUNCHER_NO_SELF_UPDATE: "1"
      BUILD: ${{ matrix.build }}
      SUNRISE_GITHUB_TOKEN: ${{ needs.route.outputs.trusted == 'true' && github.token || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.route.outputs.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master, 2026-11-15
        with:
          toolchain: ${{ needs.route.outputs.rust }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: needs.route.outputs.trusted == 'true'
        with:
          shared-key: ci-windows-native-build
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - run: cargo build --locked --bin sunrise-launcher
      - name: The build, on a profile of its channel
        env:
          CHANNEL: ${{ matrix.channel }}
        run: |
          home="${APPDATA//\\//}/sunrise/launcher"
          echo "home=$home" | tee -a "$GITHUB_ENV"
          [[ ! -e "$home" ]] || { echo "::error::$home exists before the launcher made it"; exit 1; }
          target/debug/sunrise-launcher install "$BUILD"
          echo "{\"instances\":{\"sunrise\":{\"channel\":\"$CHANNEL\"}}}" > "$home/instances.json"
          # Mojang's files never reach CI: only the preparation's manifest and stamp, which a
          # native build checks for, and no game starts here.
          version=$(ls -d "$home"/versions/*/ | head -1)
          echo "version=$version" | tee -a "$GITHUB_ENV"
          output=$(sed -n 's/^pub const OUTPUT_VERSION: u32 = \([0-9]*\);$/\1/p' "$version/crates/sunrise-prepare/src/lib.rs")
          resources="$version/.local/sunrise-client/26.3"
          mkdir -p "$resources"
          echo '{}' > "$resources/sunrise-resources.json"
          echo "{\"output_version\":$output}" > "$resources/sunrise-prepare.json"
      # GitHub's Windows images turn on long paths (LongPathsEnabled = 1); a player's Windows has them
      # off unless someone turned them on, so the build runs with Windows' default.
      - name: Windows' default path limit
        shell: pwsh
        run: |
          $key = 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem'
          "LongPathsEnabled was $((Get-ItemProperty $key).LongPathsEnabled)"
          Set-ItemProperty $key -Name LongPathsEnabled -Value 0
          "LongPathsEnabled is $((Get-ItemProperty $key).LongPathsEnabled)"
      - name: Build the mixin mod
        run: |
          mods="$RUNNER_TEMP/mods"
          mkdir -p "$mods"
          cp -r tools/ci/long-path-mod "$mods/wpm"
          # The mod pins the commit of the build just installed, as a mod made for it does.
          COMMIT=$(grep -o '"commit": *"[0-9a-f]\{40\}"' "$version/sunrise-release.json" | grep -o '[0-9a-f]\{40\}')
          [[ -n "$COMMIT" ]] || { echo "::error::no commit in $version/sunrise-release.json"; exit 1; }
          echo "pinned $COMMIT"
          sed -i "s/^sunrise = \"[^\"]*\"/sunrise = \"$COMMIT\"/" "$mods/wpm/sunrise-mod.toml"
          grep -q "^sunrise = \"$COMMIT\"" "$mods/wpm/sunrise-mod.toml" || { echo "::error::sunrise-mod.toml does not pin $COMMIT"; exit 1; }
          # Its crates.io dependency takes the build through Cargo's target folder, the deepest route.
          target/debug/sunrise-launcher native-lock "$mods/wpm"
          target/debug/sunrise-launcher native-build "$mods" --trust-native-code
      - name: The build log
        if: always()
        run: cat "$home/native/build.log" 2>/dev/null | tail -200 || true

  # A real native mod build on an Apple-chip Mac: the launcher hands the build's files over only once it
  # has proved every worker the tool started has exited (src/process/compiler_session.rs).
  macos-native-build:
    needs: route
    if: needs.route.outputs.full == 'true'
    runs-on: macos-15
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      SUNRISE_LAUNCHER_NO_SELF_UPDATE: "1"
      BUILD: dev-2026-11-25-bdad86d
      SUNRISE_GITHUB_TOKEN: ${{ needs.route.outputs.trusted == 'true' && github.token || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.route.outputs.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master, 2026-11-15
        with:
          toolchain: ${{ needs.route.outputs.rust }}
      - run: cargo build --locked --bin sunrise-launcher
      - name: The build, on a Dev profile
        run: |
          home="$RUNNER_TEMP/home/launcher"
          for name in SUNRISE_LAUNCHER_HOME SUNRISE_HOME XDG_DATA_HOME XDG_CONFIG_HOME SUNRISE_LAUNCHER_TRASH SUNRISE_LAUNCHER_CLIPBOARD SUNRISE_LAUNCHER_DESKTOP; do
            export "$name=$RUNNER_TEMP/home/$name"
            echo "$name=$RUNNER_TEMP/home/$name" >> "$GITHUB_ENV"
          done
          export SUNRISE_LAUNCHER_HOME="$home"
          { echo "SUNRISE_LAUNCHER_HOME=$home"; echo "home=$home"; } >> "$GITHUB_ENV"
          target/debug/sunrise-launcher install "$BUILD"
          echo '{"instances":{"sunrise":{"channel":"dev"}}}' > "$home/instances.json"
          # Mojang's files never reach CI: only the preparation's manifest and stamp, which a
          # native build checks for, and no game starts here.
          version=$(ls -d "$home"/versions/*/ | head -1)
          echo "version=$version" | tee -a "$GITHUB_ENV"
          output=$(sed -n 's/^pub const OUTPUT_VERSION: u32 = \([0-9]*\);$/\1/p' "$version/crates/sunrise-prepare/src/lib.rs")
          [[ -n "$output" ]] || { echo "::error::no OUTPUT_VERSION in $version/crates/sunrise-prepare/src/lib.rs"; exit 1; }
          resources="$version/.local/sunrise-client/26.3"
          mkdir -p "$resources"
          echo '{}' > "$resources/sunrise-resources.json"
          echo "{\"output_version\":$output}" > "$resources/sunrise-prepare.json"
      - name: Build an API-only mod with a crates.io dependency
        run: |
          mods="$RUNNER_TEMP/mods"
          mkdir -p "$mods"
          # The Windows leg's mod without its mixin row: Cargo still runs several compilers for it.
          cp -r tools/ci/long-path-mod "$mods/apionly"
          rm -r "$mods/apionly/src/mixins"
          COMMIT=$(grep -o '"commit": *"[0-9a-f]\{40\}"' "$version/sunrise-release.json" | grep -o '[0-9a-f]\{40\}')
          [[ -n "$COMMIT" ]] || { echo "::error::no commit in $version/sunrise-release.json"; exit 1; }
          python3 - "$mods/apionly" "$COMMIT" <<'EOF'
          import pathlib, re, sys
          mod, commit = pathlib.Path(sys.argv[1]), sys.argv[2]
          toml = (mod / "sunrise-mod.toml").read_text().split("\n# Replaces")[0]
          toml = re.sub(r'^id = "wpm"', 'id = "apionly"', toml, flags=re.M)
          toml = re.sub(r'^sunrise = "[^"]*"', f'sunrise = "{commit}"', toml, flags=re.M)
          (mod / "sunrise-mod.toml").write_text(toml)
          cargo = (mod / "Cargo.toml").read_text().replace('name = "mod-wpm"', 'name = "mod-apionly"')
          (mod / "Cargo.toml").write_text(cargo)
          EOF
          cat "$mods/apionly/sunrise-mod.toml"
          target/debug/sunrise-launcher native-lock "$mods/apionly"
          status=0
          target/debug/sunrise-launcher native-build "$mods" --trust-native-code 2>&1 | tee "$RUNNER_TEMP/native-build.out" || status=$?
          ! grep -q "couldn't prove all native build workers stopped" "$RUNNER_TEMP/native-build.out" ||
            { echo "::error::the launcher couldn't prove the build's workers stopped"; exit 1; }
          [[ "$status" == 0 ]] || { echo "::error::native-build exited $status"; exit 1; }
          grep -q "built and selected for its profile" "$RUNNER_TEMP/native-build.out" ||
            { echo "::error::the build was not installed"; exit 1; }
          ls -d "$home"/versions/native-*
      - name: The build log
        if: always()
        run: cat "$home/native/build.log" 2>/dev/null | tail -200 || true

  # The one check branch protection requires, on the commit it tested: a fork's pull request names it otherwise until a maintainer's dispatch posts `build`, and a dispatch's own run (on main) never names it.
  build:
    name: >-
      ${{ inputs.pr && format('checks of PR #{0}', inputs.pr) ||
      github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository &&
      'format (full checks wait for a maintainer)' || 'build' }}
    needs: [route, format, check, windows-native-build, macos-native-build]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Every system passed
        env:
          FULL: ${{ needs.route.outputs.full }}
          ROUTE: ${{ needs.route.result }}
          FORMAT: ${{ needs.format.result }}
          CHECK: ${{ needs.check.result }}
          WINDOWS_BUILD: ${{ needs.windows-native-build.result }}
          MACOS_BUILD: ${{ needs.macos-native-build.result }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          [[ "$ROUTE" == success ]] || { echo "::error::routing $ROUTE"; exit 1; }
          [[ "$FORMAT" == success ]] || { echo "::error::format $FORMAT"; exit 1; }
          if [[ "$FULL" == true ]]; then
            [[ "$CHECK" == success ]] || { echo "::error::systems $CHECK"; exit 1; }
            [[ "$WINDOWS_BUILD" == success ]] || { echo "::error::Windows native build $WINDOWS_BUILD"; exit 1; }
            [[ "$MACOS_BUILD" == success ]] || { echo "::error::macOS native build $MACOS_BUILD"; exit 1; }
          elif [[ "$FULL" == false ]]; then
            echo "::notice::A fork's pull request: a maintainer runs the full checks with gh workflow run ci.yml -R $GITHUB_REPOSITORY --ref main -f pr=$PR"
          else
            echo "::error::routing gave no answer"; exit 1
          fi

  # A dispatch for a fork's pull request: posts `build` on its head. It runs none of that code, so it alone holds the write permission, and only for commit statuses.
  pr-status:
    needs: [route, format, check, windows-native-build, macos-native-build]
    if: always() && github.event_name == 'workflow_dispatch' && inputs.pr != '' && needs.route.outputs.sha != '' && needs.route.outputs.trusted == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.route.outputs.sha }}
          FORMAT: ${{ needs.format.result }}
          CHECK: ${{ needs.check.result }}
          WINDOWS_BUILD: ${{ needs.windows-native-build.result }}
          MACOS_BUILD: ${{ needs.macos-native-build.result }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          state=failure
          if [[ "$FORMAT" == success && "$CHECK" == success && "$WINDOWS_BUILD" == success && "$MACOS_BUILD" == success ]]; then state=success
          elif [[ "$FORMAT" == cancelled || "$CHECK" == cancelled || "$WINDOWS_BUILD" == cancelled || "$MACOS_BUILD" == cancelled ]]; then state=error; fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state="$state" -f context=build \
            -f description="Full checks dispatched on this head: format $FORMAT, systems $CHECK, Windows build $WINDOWS_BUILD, macOS build $MACOS_BUILD" -f target_url="$RUN" > /dev/null
          echo "build=$state on $SHA"
