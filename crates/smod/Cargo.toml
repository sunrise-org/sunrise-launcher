[package]
name = "sunrise-launcher-smod"
version = "0.1.0"
edition = "2024"
license = "PolyForm-Shield-1.0.0"
description = "Sunrise's mod files as the launcher reads them: .smod and its manifest, modpacks, the registry index, a game run's shared files. Copied from the game's sunrise-mod-package without the content fence, so the launcher can leave the game repository."
publish = false

[dependencies]
sunrise-launcher-shader-api = { path = "../shader-api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = { version = "1", features = ["serde"] }
toml = "1.1.6"
# Cargo's own gitignore-style matcher, for a mod folder's `.gitignore` and its manifest's `include`
# and `exclude` (`package::source_files`).
ignore = "0.4"
log = "0.4"
png = "0.18"
sha2 = "0.10"
minisign-verify = "0.3"
cap-std = "3.4.6"
cap-fs-ext = "3.4.6"
os_pipe = "1.2.3"
getrandom = "0.4"
subtle = "2.6"
libc = "0.2"
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }
# Parses registry page and asset URLs as the publisher does.
url = "2"

[target.'cfg(unix)'.dependencies]
socket2 = "0.6"
rustix = { version = "1.1", features = ["fs", "net"] }

[target.'cfg(windows)'.dependencies]
same-file = "1.0.6"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_Storage_FileSystem", "Win32_Security_Authorization", "Win32_System_Pipes", "Win32_System_IO", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3.27.0"

# The game workspace's lints, which the copied code was written to.
[lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
needless_range_loop = "allow"
large_enum_variant = "allow"
